<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>Taco Bell Finder</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #09040f;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
}

.app {
  width: 100%;
  max-width: 430px;
  min-height: 100vh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding: 25px;
}

.title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 3px;
  color: #d9a7ff;

  margin-bottom: 20px;
}

.dial {
  width: 270px;
  height: 270px;

  border-radius: 50%;

  border: 4px solid #8b20ff;

  box-shadow:
    0 0 15px #8b20ff,
    0 0 45px rgba(139, 32, 255, 0.45),
    inset 0 0 35px rgba(139, 32, 255, 0.3);

  position: relative;

  display: flex;
  justify-content: center;
  align-items: center;
}

.dial::before {
  content: "";

  position: absolute;

  width: 210px;
  height: 210px;

  border-radius: 50%;

  border: 1px solid rgba(214, 166, 255, 0.5);
}

.direction {
  position: absolute;

  font-size: 15px;
  font-weight: bold;

  color: #dcb4ff;
}

.north {
  top: 18px;
}

.south {
  bottom: 18px;
}

.west {
  left: 20px;
}

.east {
  right: 20px;
}

.center {
  width: 24px;
  height: 24px;

  border-radius: 50%;

  background: #8b20ff;

  box-shadow:
    0 0 15px #8b20ff;

  z-index: 2;
}

.distance {
  margin-top: 28px;

  font-size: 48px;
  font-weight: 800;

  color: white;

  text-shadow:
    0 0 15px rgba(139, 32, 255, 0.8);
}

.name {
  margin-top: 8px;

  font-size: 20px;
  font-weight: bold;

  color: #dcb4ff;

  text-align: center;
}

.status {
  margin-top: 8px;

  font-size: 14px;

  color: #aaa;

  text-align: center;
}

button {
  margin-top: 25px;

  padding: 12px 22px;

  border: 1px solid #8b20ff;

  border-radius: 12px;

  background: #180b25;

  color: white;

  font-size: 15px;

  cursor: pointer;
}

button:hover {
  background: #281039;
}

</style>

</head>

<body>

<div class="app">

  <div class="title">
    TACO BELL FINDER
  </div>

  <div class="dial">

    <div class="direction north">N</div>
    <div class="direction east">E</div>
    <div class="direction south">S</div>
    <div class="direction west">W</div>

    <div class="center"></div>

  </div>

  <div
    id="distance"
    class="distance">
    —
  </div>

  <div
    id="name"
    class="name">
    Finding Taco Bell...
  </div>

  <div
    id="status"
    class="status">
    Waiting for location
  </div>

  <button onclick="findTacoBell()">
    Refresh
  </button>

</div>

<script>

const distanceEl =
  document.getElementById("distance");

const nameEl =
  document.getElementById("name");

const statusEl =
  document.getElementById("status");


function radians(degrees) {

  return degrees * Math.PI / 180;

}


function calculateDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 3958.8;

  const dLat =
    radians(lat2 - lat1);

  const dLon =
    radians(lon2 - lon1);

  const a =
    Math.sin(dLat / 2) ** 2 +

    Math.cos(radians(lat1)) *
    Math.cos(radians(lat2)) *
    Math.sin(dLon / 2) ** 2;

  return R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

}


function getLocation() {

  return new Promise(
    (resolve, reject) => {

      if (!navigator.geolocation) {

        reject(
          new Error(
            "This browser does not support location."
          )
        );

        return;
      }

      navigator.geolocation.getCurrentPosition(

        resolve,

        reject,

        {
          enableHighAccuracy: true,

          maximumAge: 60000,

          timeout: 20000
        }

      );

    }
  );

}


async function findTacoBell() {

  distanceEl.textContent = "—";

  nameEl.textContent =
    "Getting your location...";

  statusEl.textContent =
    "Please allow location access";


  try {

    const position =
      await getLocation();


    const userLat =
      position.coords.latitude;

    const userLon =
      position.coords.longitude;


    nameEl.textContent =
      "Searching Taco Bells...";

    statusEl.textContent =
      "Searching within 30 miles";


    const query = `

      [out:json][timeout:25];

      (
        nwr["brand"="Taco Bell"]
          (around:48280,${userLat},${userLon});

        nwr["name"~"Taco Bell",i]
          (around:48280,${userLat},${userLon});
      );

      out center;

    `;


    const response =
      await fetch(
        "https://overpass-api.de/api/interpreter",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/x-www-form-urlencoded;charset=UTF-8"
          },

          body:
            "data=" +
            encodeURIComponent(query)
        }
      );


    if (!response.ok) {

      throw new Error(
        "Taco Bell server error: " +
        response.status
      );

    }


    const data =
      await response.json();


    let closest = null;

    let closestDistance =
      Infinity;


    for (
      const place
      of data.elements
    ) {

      const tacoLat =
        place.lat ??
        place.center?.lat;

      const tacoLon =
        place.lon ??
        place.center?.lon;


      if (
        tacoLat == null ||
        tacoLon == null
      ) {

        continue;

      }


      const d =
        calculateDistance(
          userLat,
          userLon,
          tacoLat,
          tacoLon
        );


      if (
        d < closestDistance
      ) {

        closestDistance = d;

        closest = {

          lat: tacoLat,

          lon: tacoLon,

          name:
            place.tags?.name ||
            "Taco Bell"

        };

      }

    }


    if (!closest) {

      throw new Error(
        "No Taco Bell found within 30 miles."
      );

    }


    distanceEl.textContent =
      closestDistance.toFixed(1) +
      " mi";


    nameEl.textContent =
      closest.name;


    statusEl.textContent =
      "Nearest Taco Bell";


    document.querySelector(
      ".app"
    ).onclick = function(event) {

      if (
        event.target.tagName ===
        "BUTTON"
      ) {

        return;

      }


      const mapsURL =
        "https://www.google.com/maps/dir/?api=1" +
        "&destination=" +
        closest.lat +
        "," +
        closest.lon;


      window.location.href =
        mapsURL;

    };


  } catch (error) {

    console.error(error);


    distanceEl.textContent =
      "ERROR";


    nameEl.textContent =
      "Search failed";


    statusEl.textContent =
      error.message;

  }

}


findTacoBell();


setInterval(
  findTacoBell,
  300000
);

</script>

</body>
</html>
