<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<meta name="theme-color"
      content="#09040f">

<title>Taco Bell Finder</title>


<style>

* {
    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #09040f;

    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


body {

    min-height: 100vh;

    display: flex;

    justify-content: center;
    align-items: center;

    overflow-x: hidden;
}


.app {

    width: 100%;
    max-width: 430px;

    min-height: 100vh;

    padding:
        30px
        24px
        40px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    cursor: pointer;
}


.title {

    margin-bottom: 22px;

    color: #dcb4ff;

    font-size: 17px;

    font-weight: 800;

    letter-spacing: 3px;

    text-align: center;
}


.dial {

    width: 270px;
    height: 270px;

    position: relative;

    border-radius: 50%;

    border: 4px solid #8b20ff;

    box-shadow:

        0 0 16px #8b20ff,

        0 0 45px
        rgba(139,32,255,.45),

        inset 0 0 35px
        rgba(139,32,255,.30);
}


.dial::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 205px;
    height: 205px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    border:
        1px solid
        rgba(220,180,255,.45);
}


.direction {

    position: absolute;

    color: #dcb4ff;

    font-size: 15px;

    font-weight: 800;
}


.north {

    top: 17px;

    left: 50%;

    transform:
        translateX(-50%);
}


.south {

    bottom: 17px;

    left: 50%;

    transform:
        translateX(-50%);
}


.west {

    left: 19px;

    top: 50%;

    transform:
        translateY(-50%);
}


.east {

    right: 19px;

    top: 50%;

    transform:
        translateY(-50%);
}


.center {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 25px;
    height: 25px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #8b20ff;

    box-shadow:
        0 0 18px #8b20ff;
}


.distance {

    margin-top: 27px;

    color: white;

    font-size: 48px;

    line-height: 1;

    font-weight: 900;

    text-shadow:
        0 0 18px
        rgba(139,32,255,.8);
}


.name {

    margin-top: 12px;

    max-width: 340px;

    color: #dcb4ff;

    font-size: 19px;

    font-weight: 800;

    line-height: 1.3;

    text-align: center;
}


.status {

    margin-top: 8px;

    min-height: 20px;

    color: #999;

    font-size: 14px;

    text-align: center;
}


.refresh {

    margin-top: 24px;

    padding: 12px 24px;

    border:
        1px solid #8b20ff;

    border-radius: 12px;

    background: #180b25;

    color: white;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    touch-action: manipulation;
}


.refresh:active {

    transform: scale(.97);
}


.refresh:disabled {

    opacity: .5;

}


</style>

</head>


<body>


<div class="app" id="app">


    <div class="title">

        TACO BELL FINDER

    </div>


    <div class="dial">

        <div class="direction north">
            N
        </div>

        <div class="direction east">
            E
        </div>

        <div class="direction south">
            S
        </div>

        <div class="direction west">
            W
        </div>

        <div class="center"></div>

    </div>


    <div
        id="distance"
        class="distance">

        —

    </div>


    <div
        id="name"
        class="name">

        Finding Taco Bell...

    </div>


    <div
        id="status"
        class="status">

        Waiting for location

    </div>


    <button
        id="refresh"
        class="refresh"
        type="button">

        Refresh

    </button>


</div>


<script>


/* =====================================================
   IMPORTANT
   =====================================================

   PUT YOUR CLOUDFLARE WORKER URL HERE.

   Example:

   const WORKER_URL =
       "https://taco-bell-finder.example.workers.dev";

   DO NOT include:

   ?latitude=...
   ?longitude=...

   The app adds those automatically.
   ===================================================== */


const WORKER_URL =
    "https://tacobellfinder.landins-cool.workers.dev";


/* Page elements */

const distanceElement =
    document.getElementById("distance");


const nameElement =
    document.getElementById("name");


const statusElement =
    document.getElementById("status");


const refreshButton =
    document.getElementById("refresh");


const app =
    document.getElementById("app");


/* Current Taco Bell */

let currentStore = null;


/* =====================================================
   DISTANCE CALCULATION
   ===================================================== */

function distanceMiles(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const earthRadius =
        3958.7613;


    const dLat =
        (lat2 - lat1) *
        Math.PI / 180;


    const dLon =
        (lon2 - lon1) *
        Math.PI / 180;


    const a =

        Math.sin(dLat / 2) *
        Math.sin(dLat / 2)

        +

        Math.cos(
            lat1 * Math.PI / 180
        )

        *

        Math.cos(
            lat2 * Math.PI / 180
        )

        *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return earthRadius * c;

}


/* =====================================================
   GET GPS LOCATION
   ===================================================== */

function getLocation() {

    return new Promise(
        function(resolve, reject) {

            if (
                !navigator.geolocation
            ) {

                reject(
                    new Error(
                        "This browser does not support GPS."
                    )
                );

                return;

            }


            navigator.geolocation.getCurrentPosition(

                resolve,

                reject,

                {

                    enableHighAccuracy: true,

                    timeout: 20000,

                    maximumAge: 60000

                }

            );

        }
    );

}


/* =====================================================
   FIND NEAREST TACO BELL
   ===================================================== */

async function findTacoBell() {


    refreshButton.disabled =
        true;


    distanceElement.textContent =
        "—";


    nameElement.textContent =
        "Getting your location...";


    statusElement.textContent =
        "Allow location access";


    try {


        /* Get GPS */

        const position =
            await getLocation();


        const userLatitude =
            position.coords.latitude;


        const userLongitude =
            position.coords.longitude;


        /* Make sure Worker URL exists */

        if (
            !WORKER_URL ||
            WORKER_URL.includes(
                "PASTE-YOUR"
            )
        ) {

            throw new Error(
                "You haven't pasted your Cloudflare Worker URL into the code yet."
            );

        }


        /* Status */

        nameElement.textContent =
            "Finding Taco Bell...";


        statusElement.textContent =
            "Searching Taco Bell locations";


        /* =================================================
           THIS IS WHERE YOUR WORKER GETS CALLED
           ================================================= */

        const requestURL =
            WORKER_URL +

            "?latitude=" +

            encodeURIComponent(
                userLatitude
            ) +

            "&longitude=" +

            encodeURIComponent(
                userLongitude
            );


        /* Ask Cloudflare Worker */

        const response =
            await fetch(
                requestURL,
                {

                    method: "GET",

                    cache: "no-store",

                    headers: {

                        "Accept":
                            "application/json"

                    }

                }
            );


        /* Check HTTP response */

        if (
            !response.ok
        ) {

            throw new Error(
                "Worker returned HTTP " +
                response.status
            );

        }


        /* Convert response to JSON */

        const data =
            await response.json();


        /* Get Taco Bell stores */

        const stores =
            Array.isArray(
                data.nearByStores
            )

                ? data.nearByStores

                : [];


        if (
            stores.length === 0
        ) {

            throw new Error(
                "Taco Bell returned no stores."
            );

        }


        /* =================================================
           FIND THE CLOSEST STORE OURSELVES
           ================================================= */

        let closestStore =
            null;


        let closestDistance =
            Infinity;


        for (
            const store
            of stores
        ) {


            const latitude =
                Number(
                    store.geoPoint?.latitude
                );


            const longitude =
                Number(
                    store.geoPoint?.longitude
                );


            /* Skip stores without coordinates */

            if (

                !Number.isFinite(
                    latitude
                )

                ||

                !Number.isFinite(
                    longitude
                )

            ) {

                continue;

            }


            /* Calculate distance */

            const distance =
                distanceMiles(

                    userLatitude,

                    userLongitude,

                    latitude,

                    longitude

                );


            /* Is this the closest? */

            if (
                distance <
                closestDistance
            ) {

                closestDistance =
                    distance;


                closestStore = {

                    latitude:
                        latitude,

                    longitude:
                        longitude,

                    distance:
                        distance,

                    store:
                        store

                };

            }

        }


        /* No usable stores */

        if (
            !closestStore
        ) {

            throw new Error(
                "Taco Bell returned stores, but none had GPS coordinates."
            );

        }


        /* Save current store */

        currentStore =
            closestStore;


        /* Show distance */

        distanceElement.textContent =

            closestDistance
                .toFixed(1)

            +

            " mi";


        /* Get address */

        const address =
            closestStore.store.address;


        if (
            address
        ) {


            const addressParts = [

                address.streetAddress,

                address.city,

                address.state,

                address.zipCode

            ].filter(
                Boolean
            );


            nameElement.textContent =
                addressParts.join(", ");


        } else {


            nameElement.textContent =
                "Taco Bell";


        }


        statusElement.textContent =
            "Nearest Taco Bell";


    }

    catch (error) {


        console.error(
            "Taco Bell Finder:",
            error
        );


        currentStore =
            null;


        distanceElement.textContent =
            "ERROR";


        nameElement.textContent =
            "Couldn't find Taco Bell";


        statusElement.textContent =
            error.message ||

            "Unknown error";


    }

    finally {


        refreshButton.disabled =
            false;

    }

}


/* =====================================================
   OPEN GOOGLE MAPS
   ===================================================== */

function openGoogleMaps() {


    if (
        !currentStore
    ) {

        return;

    }


    const destination =

        currentStore.latitude +

        "," +

        currentStore.longitude;


    const mapsURL =

        "https://www.google.com/maps/dir/" +

        "?api=1" +

        "&destination=" +

        encodeURIComponent(
            destination
        );


    window.location.href =
        mapsURL;

}


/* =====================================================
   REFRESH BUTTON
   ===================================================== */

refreshButton.addEventListener(

    "click",

    function(event) {


        event.stopPropagation();


        findTacoBell();

    }

);


/* =====================================================
   TAP MAIN SCREEN → GOOGLE MAPS
   ===================================================== */

app.addEventListener(

    "click",

    function(event) {


        if (
            event.target ===
            refreshButton
        ) {

            return;

        }


        if (
            currentStore
        ) {

            openGoogleMaps();

        }

    }

);


/* =====================================================
   START
   ===================================================== */

findTacoBell();


/* =====================================================
   RECHECK EVERY 2 MINUTES
   ===================================================== */

setInterval(

    findTacoBell,

    120000

);


</script>


</body>

</html>
